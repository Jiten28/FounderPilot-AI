services:
  - type: web
    name: founderpilot-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_SECONDS
        value: "8.0"
      - key: DATABASE_URL
        value: sqlite:///./founderpilot.db
      - key: FRONTEND_ORIGIN
        value: https://founderpilot-ai-frontend.onrender.com
    healthCheckPath: /health

  - type: web
    name: founderpilot-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://founderpilot-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
